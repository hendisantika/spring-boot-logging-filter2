# This workflow builds every microservice with Maven on JDK 25 and caches dependencies.
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - authentication-server
          - eureka-server
          - first-service
          - second-service
          - gateway-server

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: ${{ matrix.service }}/pom.xml

      - name: Build with Maven for ${{ matrix.service }}
        run: mvn -B package --file ./${{ matrix.service }}/pom.xml

  dependency-graph:
    name: Dependency graph ${{ matrix.service }}
    # Only on push to main: Dependabot / fork PRs get a read-only token.
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        service:
          - authentication-server
          - eureka-server
          - first-service
          - second-service
          - gateway-server

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: ${{ matrix.service }}/pom.xml

      # Uploads the full dependency graph to GitHub to improve the quality of Dependabot alerts
      - name: Update dependency graph
        uses: advanced-security/maven-dependency-submission-action@a64327a7329c9939cf675e458452febe1894a70c
        with:
          directory: ${{ matrix.service }}
          correlator: ${{ github.job }}-${{ matrix.service }}
          # The action resolves mvnw relative to the directory twice; use runner Maven instead
          ignore-maven-wrapper: true
