spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: first
              predicates:
                - Path=/first/
              uri: http://localhost:8081
            - id: second
              predicates:
                - Path=/second/
              uri: http://localhost:8082
            - id: internal
              predicates:
                - Path=/process/
              uri: http://localhost:8090
            - id: auth-server
              predicates:
                - Path=/login/
              uri: http://localhost:8088


  main:
    web-application-type: reactive

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

